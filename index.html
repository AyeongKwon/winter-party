<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#141b36">
  <title>겨울 간식 포장마차</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="viewport">
    <main id="stage">
      <div class="sky"></div>
      <div class="lamp-glow"></div>
      <div class="snow" id="snow" aria-hidden="true"></div>
      <div class="awning" aria-hidden="true"></div>
      <div class="lamp" aria-hidden="true"></div>

      <header class="hud">
        <div class="hearts" id="hearts"></div>
        <div class="score"><span id="score">0</span>원</div>
        <button class="menu-btn" id="menuBtn" type="button">메뉴</button>
      </header>

      <section class="street" id="street" aria-label="손님"></section>

      <div class="counter-wood" aria-hidden="true"></div>
      <div class="work-surface" aria-hidden="true"></div>
      <div id="stations"></div>

      <div class="hintbar" id="hintbar" aria-live="polite"></div>

      <div class="fx" id="fx"></div>
      <div class="flash" id="flash"></div>

      <!-- 메뉴 -->
      <section class="screen" id="menuScreen">
        <h1 class="logo">겨울 간식<br>포장마차</h1>
        <p class="lead">오늘은 뭘 팔아볼까요?</p>
        <div class="menu-cards" id="menuCards"></div>
        <div class="keys-help">
          <p><kbd>←</kbd><kbd>→</kbd> 작업대 고르기 <kbd>스페이스</kbd> 하기 <kbd>↑</kbd><kbd>↓</kbd> 고르기·조절 <kbd>엔터</kbd> 손님에게 주기</p>
          <p class="touch-only">폰에서는 탭, 길게 누르기, 문지르기로 해요</p>
        </div>
      </section>

      <!-- 결과 -->
      <section class="screen" id="overScreen" hidden>
        <p class="over-snack" id="overSnack"></p>
        <h1 class="over-title">오늘 장사 끝!</h1>
        <div class="final-score"><span id="finalScore">0</span>원</div>
        <p class="final-detail" id="finalDetail"></p>
        <p class="final-best" id="finalBest"></p>
        <div class="over-buttons">
          <button class="btn" id="retryBtn" type="button">다시 하기</button>
          <button class="btn quiet" id="backBtn" type="button">다른 간식</button>
        </div>
        <p class="keys-help small"><kbd>스페이스</kbd> 다시 하기 <kbd>Esc</kbd> 다른 간식</p>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/core.js"></script>
  <script src="js/logic/bungeo.js"></script>
  <script src="js/logic/hotteok.js"></script>
  <script src="js/logic/eomuk.js"></script>
  <script src="js/view/kit.js"></script>
  <script src="js/view/bungeo.js"></script>
  <script src="js/view/hotteok.js"></script>
  <script src="js/view/eomuk.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
